name: fire_fighter
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  bottom_picker: 
  country_code_picker: 
  country_pickers: ^3.0.1
  dropdown_button2: 
  gradient_borders: 
  flutter_slidable: 
  gap: ^3.0.1 
  modal_bottom_sheet: ^3.0.0
  easy_stepper: 
  flutter_staggered_grid_view:
  table_calendar: 
  syncfusion_flutter_sliders:
  svg_flutter: 
  google_fonts: 
  get: ^4.7.3 
  simple_gradient_text: 
  weekly_date_picker:
  cached_network_image: 
  intl:
  carousel_slider: 
  pinput: 
  bottom_navy_bar: 
  stylish_bottom_bar: 
  cupertino_icons: 
  flutter_animate: ^4.5.2
  shared_preferences: 
  bounce: ^1.0.2
  intro_screen_onboarding_flutter: ^1.0.0
  smooth_page_indicator: 
  syncfusion_flutter_charts: ^28.1.4
  fl_chart: 
  draggable_home:
  flutter_advanced_drawer: 
  tap_to_expand: ^0.7.2
  persistent_bottom_nav_bar_v2: 
  dotted_border:
  flutter_spinkit: ^5.2.0
  flutter_neumorphic: ^3.2.0
  action_slider: ^0.7.0
  animated_bottom_navigation_bar: ^1.4.0
  rename_app:
  shimmer: 
  url_launcher:
  firebase_app_check: ^0.4.1+4




  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5
  firebase_messaging: ^16.1.0
  get_storage: ^2.1.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3
  
  


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter_18pt-Black.ttf
          weight: 900

flutter_assets:
  assets_path: assets/
  output_path: lib/generated/
  filename: assets.dart
  field_prefix: ""